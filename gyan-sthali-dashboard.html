<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ज्ञान स्थली डैशबोर्ड – विद्यालय-वार पर्ची PDF (ZIP)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--saf:#E4600F;--grn:#1B6B3A;--ink:#2B2118;--paper:#FFF8F0;--line:#F0D9C4}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Devanagari","Mangal",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
.hero{background:var(--saf);color:#fff;padding:16px;display:flex;gap:14px;align-items:center}
.hero img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #fff;background:#fff;flex:none}
.hero h1{margin:0;font-size:1.6rem;font-weight:800;line-height:1.2}.hero h1 span{font-size:.55em;font-weight:600;white-space:nowrap}
.hero p{margin:2px 0 0;font-size:.9rem}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border:2px solid var(--saf);border-radius:14px;padding:16px}
h2{margin:0 0 6px;font-size:1.2rem;color:var(--saf)}
.note{font-size:.85rem;color:#6b5a4a;margin:0 0 8px}
label{display:block;font-size:.85rem;margin:12px 0 3px;color:#6b5a4a}
select{width:100%;padding:12px;font:inherit;border:1.5px solid #d9c3ad;border-radius:8px;background:#fff}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:13px;cursor:pointer;color:#fff}
button:disabled{opacity:.5;cursor:default}
.go{width:100%;margin-top:14px;background:var(--saf);font-size:1.1rem}
.cl{width:100%;margin-top:8px;background:#6b5a4a}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.kp div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kp b{display:block;font-size:1.5rem;color:var(--grn);line-height:1.2}.kp small{color:#6b5a4a}
.ck{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink)}
.bar{height:16px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:var(--grn)}
#ptxt{margin:8px 0 0;font-size:.9rem}
footer{text-align:center;font-size:.75rem;color:#8a7867;padding:20px 16px}
@media(min-width:700px){.kp{grid-template-columns:repeat(4,1fr)}}
</style></head>

function makeZip(fs){

  const k=$("d").value;if(!k||!GR.length)return;
  STOP=false;HIDEADDR=!$("addr").checked;
  $("start").disabled=$("d").disabled=$("addr").disabled=true;$("stop").hidden=false;
  const total=GR.reduce((s,g)=>s+g.a.length,0),files=[],t0=Date.now();let done=0,csv="file,school,teachers\n";
  try{
    try{await document.fonts.load("700 30px 'Noto Sans Devanagari'")}catch(_){}
    const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=CONFIG.photo});
    for(let gi=0;gi<GR.length;gi++){
      const g=GR[gi],pages=[];
      for(let i=0;i<g.a.length;i+=6){
        if(STOP)throw"stop";
        const chunk=g.a.slice(i,i+6);pages.push(await pageBlob(chunk,img));done+=chunk.length;
        const el=(Date.now()-t0)/1000,left=Math.max(0,Math.round(el/done*(total-done)));
        $("bi").style.width=(done/total*100).toFixed(1)+"%";
        $("ptxt").textContent="विद्यालय "+(gi+1)+"/"+GR.length+" | पर्चियाँ "+done.toLocaleString("en-IN")+"/"+total.toLocaleString("en-IN")+" | बचा समय लगभग "+Math.floor(left/60)+" मिनट "+(left%60)+" सेकंड";
        await tick();
      }
      const pdf=makePDF(pages),buf=new Uint8Array(await pdf.arrayBuffer());
      const name=String(g.k?gi:0).padStart(4,"0")+"-"+(g.k?slug(g.k):"NO-SCHOOL-NAME")+"-"+g.a.length+"-teachers.pdf";
      files.push({name:DB[k].d+"/"+name,blob:pdf,crc:crc(buf),size:buf.length});csv+='"'+name+'","'+(g.k||"(विद्यालय का नाम नहीं)").replace(/"/g,'""')+'",'+g.a.length+"\n";
    }
    const cb=new Blob(["\ufeff"+csv],{type:"text/csv"});files.push({name:DB[k].d+"/000-index.csv",blob:cb,crc:crc(new Uint8Array(await cb.arrayBuffer())),size:cb.size});
    $("ptxt").textContent="ZIP बन रही है…";await tick();
    const zip=makeZip(files),u=URL.createObjectURL(zip),nm=k+"-school-wise-parchi.zip",a=document.createElement("a");
    a.href=u;a.download=nm;document.body.appendChild(a);a.click();a.remove();
    $("bi").style.width="100%";
    $("ptxt").innerHTML="✓ तैयार: "+(GR.length)+" PDF, कुल "+done.toLocaleString("en-IN")+" पर्चियाँ (जिले के कुल मतदाता "+total.toLocaleString("en-IN")+"), आकार "+(zip.size/1048576).toFixed(0)+" MB। डाउनलोड न हो तो <a href=\""+u+"\" download=\""+nm+"\">यहाँ दबाकर सेव करें</a>";
  }catch(e){$("ptxt").textContent=e==="stop"?"रोक दिया गया।":"कुछ गड़बड़ हुई: "+e}
  finally{HIDEADDR=true;$("start").disabled=$("d").disabled=$("addr").disabled=false;$("stop").hidden=true}
};

</script>
</body></html>
